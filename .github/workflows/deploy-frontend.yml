name: Deploy frontend

# Every push to main that touches the frontend is built and type-checked here,
# then deployed to the droplet. Setup: deploy/README.md.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

# Queue deploys instead of cancelling one halfway through a container swap
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit -p .
      - run: npm run build

  deploy:
    name: Deploy to droplet
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy settings
        id: cfg
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::warning::Deploy secrets are not set yet, so this run only built the site. See deploy/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The server only lets this key run deploy/ci-deploy.sh, which takes the commit to deploy
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "root@$HOST" "$GITHUB_SHA"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy_key
