<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Deadlock - 1v1 Competitive Coding</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&family=Space+Grotesk:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <!-- Prevent flash of wrong theme (FOUC) -->
    <script>
      (function() {
        var theme = localStorage.getItem('deadlock-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>

    <style>
      /* ========================================
         THEME SYSTEM — CSS Custom Properties
         ======================================== */
      :root {
        /* Backgrounds */
        --bg-primary: #050505;
        --bg-secondary: #0a0a0a;
        --bg-card: rgba(28, 25, 23, 0.4);
        --bg-card-solid: #1c1917;
        --bg-card-hover: #292524;
        --bg-input: rgba(0, 0, 0, 0.5);
        --bg-elevated: rgba(0, 0, 0, 0.8);
        --bg-surface: rgba(10, 10, 10, 0.8);

        /* Text */
        --text-primary: #ffffff;
        --text-secondary: #a8a29e;
        --text-muted: #78716c;
        --text-dim: #57534e;
        --text-ghost: #44403c;

        /* Borders */
        --border-primary: #292524;
        --border-subtle: rgba(255, 255, 255, 0.05);

        /* Scrollbar */
        --scrollbar-track: #000000;
        --scrollbar-thumb: #333333;

        /* Misc */
        --shadow-glow: rgba(220, 38, 38, 0.3);
        --noise-opacity: 0.015;
        --grid-line-color: rgba(255, 255, 255, 0.02);
        --gradient-overlay: rgba(5, 5, 5, 0.9);
      }

      [data-theme="light"] {
        --bg-primary: #f8fafc; /* slate-50 */
        --bg-secondary: #ffffff;
        --bg-card: rgba(255, 255, 255, 0.7);
        --bg-card-solid: #f1f5f9; /* slate-100 */
        --bg-card-hover: #e2e8f0; /* slate-200 */
        --bg-input: #ffffff;
        --bg-elevated: rgba(255, 255, 255, 0.95);
        --bg-surface: rgba(255, 255, 255, 0.85);

        --text-primary: #0f172a; /* slate-900 */
        --text-secondary: #334155; /* slate-700 */
        --text-muted: #64748b; /* slate-500 */
        --text-dim: #94a3b8; /* slate-400 */
        --text-ghost: #cbd5e1; /* slate-300 */

        --border-primary: #e2e8f0; /* slate-200 */
        --border-subtle: rgba(15, 23, 42, 0.06); /* slate-900 with opacity */

        --scrollbar-track: #f8fafc;
        --scrollbar-thumb: #cbd5e1;

        --shadow-glow: rgba(220, 38, 38, 0.08); /* softer red glow */
        --noise-opacity: 0; /* remove noise in light mode for a cleaner look */
        --grid-line-color: rgba(15, 23, 42, 0.04); /* very subtle grid */
        --gradient-overlay: rgba(248, 250, 252, 0.9);
      }

      /* ========================================
         BASE STYLES
         ======================================== */
      body {
        font-family: 'JetBrains Mono', monospace;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      /* Hide cursor only on non-touch (pointer:fine) devices */
      @media (pointer: fine) {
        body {
          cursor: none;
        }
        a, button, input, textarea, [role="button"] {
          cursor: none;
        }
      }

      h1, h2, h3, h4, .brand-font {
        font-family: 'Space Grotesk', sans-serif;
      }
      .mono-font {
        font-family: 'JetBrains Mono', monospace;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      .perspective-2000 {
        perspective: 2000px;
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 0px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ef4444;
      }
      
      /* ========================================
         ANIMATIONS
         ======================================== */
      @keyframes grid-move {
        0% { background-position: 0 0; }
        100% { background-position: 60px 60px; }
      }
      
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      @keyframes radar-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.3); opacity: 0; }
      }

      .animate-grid {
        animation: grid-move 4s linear infinite;
      }
      
      .animate-marquee {
        animation: marquee 30s linear infinite;
      }

      .animate-marquee:hover {
        animation-play-state: paused;
      }

      .scanline::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.3) 51%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 10;
        opacity: 0.1;
      }

      .crt-flicker {
        animation: flicker 0.15s infinite;
        pointer-events: none;
      }

      @keyframes flicker {
        0% { opacity: 0.97; }
        100% { opacity: 1; }
      }

      .glitch-wrapper {
        position: relative;
      }

      /* ========================================
         THEME TRANSITIONS
         ======================================== */
      .theme-transition {
        transition: background-color 0.3s ease, 
                    color 0.3s ease, 
                    border-color 0.3s ease,
                    box-shadow 0.3s ease;
      }

      /* ========================================
         PERFORMANCE
         ======================================== */
      .animate-grid,
      .animate-marquee {
        will-change: transform;
      }

      @media (prefers-reduced-motion: reduce) {
        .animate-grid,
        .animate-marquee,
        .animate-pulse,
        .crt-flicker {
          animation: none !important;
        }
      }

      @media (max-width: 640px) {
        .animate-grid {
          animation-duration: 8s;
        }
        .perspective-1000,
        .perspective-2000 {
          perspective: none;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@uiw/react-codemirror": "https://esm.sh/@uiw/react-codemirror?external=react,react-dom",
    "@codemirror/lang-javascript": "https://esm.sh/@codemirror/lang-javascript",
    "@codemirror/lang-python": "https://esm.sh/@codemirror/lang-python",
    "@codemirror/lang-cpp": "https://esm.sh/@codemirror/lang-cpp",
    "@uiw/codemirror-theme-vscode": "https://esm.sh/@uiw/codemirror-theme-vscode"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
