<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadlock - 1v1 Competitive Coding</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700;800&family=Space+Grotesk:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'JetBrains Mono', monospace;
        background-color: #050505;
        color: white;
        overflow-x: hidden;
        cursor: none; /* Hide default cursor */
      }
      
      /* Hide cursor on interactive elements too */
      a, button, input, textarea, [role="button"] {
        cursor: none;
      }

      h1, h2, h3, h4, .brand-font {
        font-family: 'Space Grotesk', sans-serif;
      }
      .mono-font {
        font-family: 'JetBrains Mono', monospace;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      .perspective-2000 {
        perspective: 2000px;
      }
      .preserve-3d {
        transform-style: preserve-3d;
      }
      .backface-hidden {
        backface-visibility: hidden;
      }
      
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #000;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 0px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ef4444; /* red-500 */
      }
      
      /* Animations */
      @keyframes grid-move {
        0% { background-position: 0 0; }
        100% { background-position: 60px 60px; }
      }
      
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }

      @keyframes marquee {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }

      @keyframes radar-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes pulse-ring {
        0% { transform: scale(0.8); opacity: 0.5; }
        100% { transform: scale(1.3); opacity: 0; }
      }

      .animate-grid {
        animation: grid-move 4s linear infinite;
      }
      
      .animate-marquee {
        animation: marquee 30s linear infinite;
      }

      .animate-marquee:hover {
        animation-play-state: paused;
      }

      .scanline::before {
        content: " ";
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.3) 51%);
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 10;
        opacity: 0.1;
      }

      .crt-flicker {
        animation: flicker 0.15s infinite;
        pointer-events: none;
      }

      @keyframes flicker {
        0% { opacity: 0.97; }
        100% { opacity: 1; }
      }

      /* Glitch Text Effect Utility */
      .glitch-wrapper {
        position: relative;
      }

      /* ===== 8-BIT / PIXEL ART EFFECTS ===== */

      /* Pixel font for retro text */
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

      .pixel-font {
        font-family: 'Press Start 2P', monospace;
      }

      /* Pixel border - 8bit style stepped edges */
      .pixel-border {
        box-shadow:
          -4px 0 0 0 currentColor,
          4px 0 0 0 currentColor,
          0 -4px 0 0 currentColor,
          0 4px 0 0 currentColor;
      }

      /* CRT scanlines overlay */
      .crt-scanlines {
        position: relative;
      }
      .crt-scanlines::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(0, 0, 0, 0.15) 0px,
          rgba(0, 0, 0, 0.15) 1px,
          transparent 1px,
          transparent 3px
        );
        pointer-events: none;
        z-index: 50;
      }

      /* Pixel-art floating squares */
      @keyframes pixel-float {
        0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
        25% { transform: translateY(-12px) rotate(90deg); opacity: 1; }
        50% { transform: translateY(-6px) rotate(180deg); opacity: 0.4; }
        75% { transform: translateY(-18px) rotate(270deg); opacity: 0.8; }
      }

      @keyframes pixel-rain {
        0% { transform: translateY(-100vh); opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { transform: translateY(100vh); opacity: 0; }
      }

      @keyframes pixel-blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }

      @keyframes pixel-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }

      @keyframes pixel-shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-2px); }
        75% { transform: translateX(2px); }
      }

      @keyframes pixel-expand {
        0% { transform: scale(0); opacity: 0; }
        50% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes retro-glow {
        0%, 100% { text-shadow: 0 0 4px currentColor, 0 0 8px currentColor; }
        50% { text-shadow: 0 0 8px currentColor, 0 0 16px currentColor, 0 0 24px currentColor; }
      }

      @keyframes score-count {
        0% { transform: scale(1); }
        50% { transform: scale(1.3); }
        100% { transform: scale(1); }
      }

      .animate-pixel-float { animation: pixel-float 3s ease-in-out infinite; }
      .animate-pixel-blink { animation: pixel-blink 1s steps(1) infinite; }
      .animate-pixel-bounce { animation: pixel-bounce 0.6s steps(3) infinite; }
      .animate-pixel-shake { animation: pixel-shake 0.3s steps(2) infinite; }
      .animate-pixel-expand { animation: pixel-expand 0.5s steps(4) forwards; }
      .animate-retro-glow { animation: retro-glow 2s ease-in-out infinite; }
      .animate-score-count { animation: score-count 0.4s steps(3) forwards; }

      /* Pixelated image rendering */
      .pixelated {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Stepped/pixelated gradient bg */
      .pixel-grid-bg {
        background-image:
          linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 8px 8px;
      }
    </style>

{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

    "react/": "https://aistudiocdn.com/react@^19.2.0/",

    "@codemirror/lang-cpp": "https://esm.sh/@codemirror/lang-cpp",

  }
}
</script>
</head>

</html>
